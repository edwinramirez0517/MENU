<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Reportes - El Compadre</title>
    <style>
        /* COLORES SEGÚN EL MANUAL DE MARCA */
        :root {
            --rojo-compadre: #E1251B;
            --azul-compadre: #012094;
            --gris-fondo: #f4f4f4;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: var(--gris-fondo);
            color: #333;
        }

        /* ENCABEZADO */
        header {
            background-color: var(--rojo-compadre);
            color: white;
            padding: 40px 20px;
            text-align: center;
            border-bottom: 8px solid var(--azul-compadre);
        }

        h1 { margin: 0; font-size: 2.5em; }
        .eslogan { font-style: italic; opacity: 0.9; }

        /* CONTENEDOR DE TARJETAS */
        .grid-proyectos {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 50px 20px;
            flex-wrap: wrap;
        }

        /* CADA TARJETA DE PROYECTO */
        .tarjeta {
            background: white;
            width: 300px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
            text-align: center;
            border: 1px solid #ddd;
        }

        .tarjeta:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .tarjeta-header {
            background-color: var(--azul-compadre);
            color: white;
            padding: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .tarjeta-cuerpo {
            padding: 20px;
        }

        /* BOTONES */
        .btn-ver {
            display: inline-block;
            background-color: var(--rojo-compadre);
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }

        .btn-ver:hover {
            background-color: #b31d15;
        }
    </style>
</head>
<body>

<header>
    <h1>PANEL DE CONTROL LOGÍSTICO</h1>
    <p class="eslogan">"En precios y moda, el más padre"</p>
</header>

<div class="grid-proyectos">
    <div class="tarjeta">
        <div class="tarjeta-header">Ventas y Saldos</div>
        <div class="tarjeta-cuerpo">
            <p>Análisis de movimientos y disponibilidad de inventario.</p>
            <a href="https://edwinramirez0517.github.io/Ventas_Saldos/" class="btn-ver">Abrir Reporte</a>
        </div>
    </div>

    <div class="tarjeta">
        <div class="tarjeta-header">Suministros</div>
        <div class="tarjeta-cuerpo">
            <p>Control de movimientos de suministros y saldos operativos.</p>
            <a href="https://edwinramirez0517.github.io/Movimiento_Suministro_Saldos/" class="btn-ver">Abrir Reporte</a>
        </div>
    </div>
</div>

</body>
</html>
