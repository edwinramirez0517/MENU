<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Logístico - El Compadre</title>
    <style>
        :root {
            --rojo: #E1251B;
            --azul: #012094;
            --gris: #f4f4f4;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--gris); overflow: hidden; }

        /* --- CONTENEDOR DEL MENÚ (PANTALLA INICIAL) --- */
        #seccion-menu {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            background: var(--gris);
        }

        header {
            background: var(--rojo);
            color: white;
            padding: 30px 15px;
            text-align: center;
            border-bottom: 6px solid var(--azul);
        }

        .grid-proyectos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 40px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .tarjeta {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            border-top: 5px solid var(--azul);
            transition: 0.3s;
        }

        .tarjeta:hover { transform: translateY(-10px); border-top-color: var(--rojo); }

        /* --- CONTENEDOR DEL REPORTE (PANTALLA COMPLETA) --- */
        #seccion-reporte {
            display: none; /* Oculto al inicio */
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
            background: white;
        }

        .barra-control {
            background: white;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--azul);
        }

        .btn-regresar {
            background: var(--azul);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-regresar:hover { background: var(--rojo); }

        iframe { flex-grow: 1; width: 100%; border: none; }
    </style>
</head>
<body>

    <div id="seccion-menu">
        <header>
            <h1>Centro de Control Operativo</h1>
            <div style="font-style: italic; font-size: 14px;">"En precios y moda, el más padre"</div>
        </header>

        <div class="grid-proyectos">
            <div class="tarjeta" onclick="mostrarReporte('https://edwinramirez0517.github.io/Ventas_Saldos/')">
                <h3>📊 Ventas y Saldos</h3>
                <p>Ver reporte detallado de salidas e inventario.</p>
                <b style="color: var(--azul);">ABRIR ANÁLISIS</b>
            </div>

            <div class="tarjeta" onclick="mostrarReporte('https://edwinramirez0517.github.io/Movimiento_Suministro_Saldos/')">
                <h3>📦 Suministros</h3>
                <p>Ver movimientos operativos de bodega central.</p>
                <b style="color: var(--azul);">ABRIR CONTROL</b>
            </div>
        </div>
    </div>

    <div id="seccion-reporte">
        <div class="barra-control">
            <button class="btn-regresar" onclick="ocultarReporte()">⬅️ Salir al Menú Principal</button>
            <span style="margin-left: 20px; font-weight: bold; color: var(--azul);">Visor de Datos El Compadre</span>
        </div>
        <iframe id="visor-html" src=""></iframe>
    </div>

    <script>
        function mostrarReporte(url) {
            // Oculta el menú y muestra el reporte
            document.getElementById('seccion-menu').style.display = 'none';
            document.getElementById('seccion-reporte').style.display = 'flex';
            // Carga el proyecto en el visor
            document.getElementById('visor-html').src = url;
        }

        function ocultarReporte() {
            // Regresa al estado inicial
            document.getElementById('seccion-reporte').style.display = 'none';
            document.getElementById('seccion-menu').style.display = 'flex';
            // Limpia el visor para no gastar recursos
            document.getElementById('visor-html').src = '';
        }
    </script>

</body>
</html>
