<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Logístico - El Compadre</title>
    <style>
        /* COLORES CORPORATIVOS SEGÚN MANUAL */
        :root {
            --rojo: #E1251B;
            --azul: #012094;
            --fondo: #f4f7f6;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--fondo); overflow: hidden; }

        /* --- SECCIÓN DEL MENÚ PRINCIPAL --- */
        #pantalla-menu {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow-y: auto;
        }

        header {
            background: var(--rojo);
            color: white;
            padding: 30px 15px;
            text-align: center;
            border-bottom: 6px solid var(--azul);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        header h1 { margin: 0; font-size: 22px; text-transform: uppercase; }
        .eslogan { font-style: italic; font-size: 14px; display: block; margin-top: 5px; opacity: 0.9; }

        .contenedor-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: 0.3s;
            border-top: 5px solid var(--azul);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.15);
            border-top-color: var(--rojo);
        }

        .card h3 { color: var(--azul); margin-bottom: 15px; }
        .card p { color: #666; font-size: 14px; margin-bottom: 20px; }

        .btn-abrir {
            background: var(--azul);
            color: white;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            display: inline-block;
        }

        /* --- SECCIÓN DEL VISOR (OCULTA POR DEFECTO) --- */
        #pantalla-reporte {
            display: none; /* Se activa con JS */
            flex-direction: column;
            height: 100vh;
            width: 100%;
        }

        .barra-superior {
            background: #fff;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--azul);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-volver {
            background: var(--azul);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 15px;
        }

        .btn-volver:hover { background: var(--rojo); }

        iframe {
            flex-grow: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="pantalla-menu">
        <header>
            <h1>Portal de Inteligencia Logística</h1>
            <span class="eslogan">"En precios y moda, el más padre"</span>
        </header>

        <div class="contenedor-cards">
            <div class="card" onclick="abrirReporte('https://edwinramirez0517.github.io/Ventas_Saldos/')">
                <h3>📊 Ventas y Saldos</h3>
                <p>Análisis de movimientos y disponibilidad de inventario actual.</p>
                <div class="btn-abrir">Abrir Reporte</div>
            </div>

            <div class="card" onclick="abrirReporte('https://edwinramirez0517.github.io/Movimiento_Suministro_Saldos/')">
                <h3>📦 Suministros</h3>
                <p>Control de movimientos operativos y gestión de saldos.</p>
                <div class="btn-abrir">Abrir Reporte</div>
            </div>
        </div>
    </div>

    <div id="pantalla-reporte">
        <div class="barra-superior">
            <button class="btn-volver" onclick="cerrarReporte()">⬅️ Volver al Menú</button>
            <span style="font-weight: bold; color: #012094;">Visualizando Reporte Operativo</span>
        </div>
        <iframe id="iframe-visor" src=""></iframe>
    </div>

    <script>
        function abrirReporte(url) {
            // 1. Ocultar el menú
            document.getElementById('pantalla-menu').style.display = 'none';
            // 2. Mostrar la pantalla del reporte
            document.getElementById('pantalla-reporte').style.display = 'flex';
            // 3. Cargar el link en el iframe
            document.getElementById('iframe-visor').src = url;
        }

        function cerrarReporte() {
            // 1. Ocultar el reporte
            document.getElementById('pantalla-reporte').style.display = 'none';
            // 2. Mostrar el menú de nuevo
            document.getElementById('pantalla-menu').style.display = 'flex';
            // 3. Limpiar el iframe para que no consuma datos
            document.getElementById('iframe-visor').src = '';
        }
    </script>

</body>
</html>
