<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Logístico - El Compadre</title>
    <style>
        :root {
            --rojo: #E1251B; /*  */
            --azul: #012094; /*  */
            --gris: #f4f4f4;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--gris); overflow: hidden; }

        /* --- PANTALLA DE INICIO (MENÚ) --- */
        #seccion-menu {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: absolute;
            z-index: 10;
        }

        header {
            background: var(--rojo);
            color: white;
            padding: 25px 15px;
            text-align: center;
            border-bottom: 6px solid var(--azul);
        }

        .grid-proyectos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .tarjeta {
            background: white;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            border-top: 5px solid var(--azul);
            transition: 0.3s;
        }

        .tarjeta:hover { transform: translateY(-10px); border-top-color: var(--rojo); }

        /* --- PANTALLA DEL REPORTE (VISOR) --- */
        #seccion-reporte {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            position: absolute;
            z-index: 20;
            background: white;
        }

        .barra-control {
            background: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid var(--azul);
        }

        .btn-regresar {
            background: var(--azul);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- CONTENEDOR MÁGICO PARA MÓVIL --- */
        .contenedor-iframe {
            flex-grow: 1;
            width: 100%;
            overflow: auto; /* Permite mover el reporte con el dedo */
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            min-width: 1000px; /* Obliga al reporte a no "aplastarse" en el celular */
        }

        /* Ajuste para que en PC se vea normal y en móvil permita scroll */
        @media (min-width: 1001px) {
            iframe { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div id="seccion-menu">
        <header>
            <h1>Portal de Inteligencia Logística</h1>
            <div style="font-style: italic; font-size: 14px;">"En precios y moda, el más padre" [cite: 2]</div>
        </header>

        <div class="grid-proyectos">
            <div class="tarjeta" onclick="mostrarReporte('https://edwinramirez0517.github.io/Ventas_Saldos/')">
                <h3>📊 Ventas y Saldos</h3>
                <p>Análisis de movimientos y disponibilidad de inventario.</p>
                <b style="color: var(--azul);">ABRIR REPORTE</b>
            </div>

            <div class="tarjeta" onclick="mostrarReporte('https://edwinramirez0517.github.io/Movimiento_Suministro_Saldos/')">
                <h3>📦 Suministros</h3>
                <p>Control de movimientos operativos de bodega.</p>
                <b style="color: var(--azul);">ABRIR REPORTE</b>
            </div>
        </div>
    </div>

    <div id="seccion-reporte">
        <div class="barra-control">
            <button class="btn-regresar" onclick="ocultarReporte()">⬅️ Menú</button>
            <span style="margin-left: 15px; font-weight: bold; color: var(--azul); font-size: 14px;">Visor Optimizado</span>
        </div>
        <div class="contenedor-iframe">
            <iframe id="visor-html" src=""></iframe>
        </div>
    </div>

    <script>
        function mostrarReporte(url) {
            document.getElementById('seccion-menu').style.display = 'none';
            document.getElementById('seccion-reporte').style.display = 'flex';
            document.getElementById('visor-html').src = url;
        }

        function ocultarReporte() {
            document.getElementById('seccion-reporte').style.display = 'none';
            document.getElementById('seccion-menu').style.display = 'flex';
            document.getElementById('visor-html').src = '';
        }
    </script>

</body>
</html>
