<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Logístico - El Compadre</title>
    <style>
        :root {
            --rojo: #E1251B; /* Rojo Corporativo [cite: 33] */
            --azul: #012094; /* Azul Corporativo [cite: 42] */
            --fondo: #f4f4f4;
        }

        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--fondo); overflow: hidden; }

        /* --- MENÚ PRINCIPAL --- */
        #seccion-menu {
            display: flex; flex-direction: column; height: 100vh; width: 100%; position: absolute; z-index: 10;
        }

        header {
            background: var(--rojo); color: white; padding: 20px; text-align: center; border-bottom: 6px solid var(--azul);
        }

        .grid-proyectos {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 30px; max-width: 1000px; margin: 0 auto;
        }

        .tarjeta {
            background: white; border-radius: 12px; padding: 25px; text-align: center; box-shadow: 0 8px 15px rgba(0,0,0,0.1); cursor: pointer; border-top: 5px solid var(--azul); transition: 0.3s;
        }

        /* --- VISOR DE REPORTES --- */
        #seccion-reporte {
            display: none; flex-direction: column; height: 100vh; width: 100%; position: absolute; z-index: 20; background: white;
        }

        .barra-control {
            background: white; padding: 10px 15px; display: flex; align-items: center; border-bottom: 2px solid var(--azul);
        }

        .btn-regresar {
            background: var(--azul); color: white; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        /* CONTENEDOR PARA EVITAR EL AMONTONAMIENTO EN MÓVIL */
        .contenedor-scroll {
            flex-grow: 1;
            width: 100%;
            overflow: auto; /* Permite mover el reporte con el dedo */
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            width: 1280px; /* Forzamos un ancho de computadora  */
            height: 100%;
            border: none;
            transform-origin: 0 0;
        }

        /* Ajuste para que en PC use el 100% y en móvil mantenga el ancho fijo */
        @media (min-width: 1281px) {
            iframe { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="seccion-menu">
        <header>
            <h1>Centro de Inteligencia Logística</h1>
            <div style="font-style: italic; font-size: 14px;">"En precios y moda, el más padre" [cite: 2, 8]</div>
        </header>

        <div class="grid-proyectos">
            <div class="tarjeta" onclick="mostrarReporte('https://edwinramirez0517.github.io/Ventas_Saldos/')">
                <h3>📊 Ventas y Saldos</h3>
                <p>Análisis de movimientos y disponibilidad.</p>
                <b style="color: var(--azul);">ABRIR</b>
            </div>

            <div class="tarjeta" onclick="mostrarReporte('https://edwinramirez0517.github.io/Movimiento_Suministro_Saldos/')">
                <h3>📦 Suministros</h3>
                <p>Control de movimientos de bodega.</p>
                <b style="color: var(--azul);">ABRIR</b>
            </div>
        </div>
    </div>

    <div id="seccion-reporte">
        <div class="barra-control">
            <button class="btn-regresar" onclick="ocultarReporte()">⬅️ Menú</button>
            <span style="margin-left: 15px; font-weight: bold; color: var(--azul);">Visor El Compadre</span>
        </div>
        <div class="contenedor-scroll">
            <iframe id="visor-html" src=""></iframe>
        </div>
    </div>

    <script>
        function mostrarReporte(url) {
            document.getElementById('seccion-menu').style.display = 'none';
            document.getElementById('seccion-reporte').style.display = 'flex';
            document.getElementById('visor-html').src = url;
        }

        function ocultarReporte() {
            document.getElementById('seccion-reporte').style.display = 'none';
            document.getElementById('seccion-menu').style.display = 'flex';
            document.getElementById('visor-html').src = '';
        }
    </script>

</body>
</html>
